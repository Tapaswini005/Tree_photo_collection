<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tree Photo Collection</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- PARTICLE CANVAS -->
    <canvas id="particles"></canvas>


    <!-- MAIN SCENE -->
    <main class="scene">


        <!-- GLOWING GROUND -->
        <div class="ground-glow"></div>


        <!-- TREE -->
        <div class="tree-wrapper">

            <svg
                class="tree"
                viewBox="0 0 1000 900"
                xmlns="http://www.w3.org/2000/svg"
            >

                <defs>

                    <!-- GOLDEN GRADIENT -->
                    <linearGradient
                        id="goldGradient"
                        x1="0"
                        y1="1"
                        x2="0"
                        y2="0"
                    >

                        <stop
                            offset="0%"
                            stop-color="#fff3c4"
                        />

                        <stop
                            offset="45%"
                            stop-color="#f6d681"
                        />

                        <stop
                            offset="100%"
                            stop-color="#d9a94d"
                        />

                    </linearGradient>


                    <!-- SOFT GLOW -->
                    <filter
                        id="softGlow"
                        x="-50%"
                        y="-50%"
                        width="200%"
                        height="200%"
                    >

                        <feGaussianBlur
                            stdDeviation="5"
                            result="blur"
                        />

                        <feMerge>

                            <feMergeNode
                                in="blur"
                            />

                            <feMergeNode
                                in="SourceGraphic"
                            />

                        </feMerge>

                    </filter>


                    <!-- STRONG GLOW -->
                    <filter
                        id="strongGlow"
                        x="-80%"
                        y="-80%"
                        width="260%"
                        height="260%"
                    >

                        <feGaussianBlur
                            stdDeviation="10"
                            result="blur1"
                        />

                        <feGaussianBlur
                            stdDeviation="3"
                            result="blur2"
                        />

                        <feMerge>

                            <feMergeNode
                                in="blur1"
                            />

                            <feMergeNode
                                in="blur2"
                            />

                            <feMergeNode
                                in="SourceGraphic"
                            />

                        </feMerge>

                    </filter>

                </defs>


                <!-- =====================================
                     ROOTS
                ====================================== -->

                <g class="tree-part roots">

                    <path
                        class="tree-line root-line"
                        d="
                        M500 820
                        C470 845 420 850 350 870
                        "
                    />

                    <path
                        class="tree-line root-line"
                        d="
                        M500 820
                        C450 855 400 875 300 880
                        "
                    />

                    <path
                        class="tree-line root-line"
                        d="
                        M500 820
                        C530 850 600 860 680 875
                        "
                    />

                    <path
                        class="tree-line root-line"
                        d="
                        M500 820
                        C570 850 650 875 760 880
                        "
                    />

                    <path
                        class="tree-line thin-line"
                        d="
                        M470 830
                        C430 850 390 850 340 850
                        "
                    />

                    <path
                        class="tree-line thin-line"
                        d="
                        M530 830

                        "
                    />

                </g>


                <!-- =====================================
                     MAIN TRUNK
                ====================================== -->

                <!-- =====================================
                     LEFT MAIN BRANCH

                    />

                </g>

            </svg>

        </div>


        <!-- =====================================
             PHOTO MEMORY FRAMES
        ====================================== -->

        <div class="photo cousin1">
            <img src="assets/images/cousin1.jpg" alt="Cousin 1">
        </div>

        <div class="photo cousin2">
            <img src="assets/images/cousin2.jpg" alt="Cousin 2">
        </div>

        <div class="photo cousin3">

        </div>

        <div class="photo cousin4">
            <img src="assets/images/cousin4.jpg" alt="Cousin 4">
        </div>

        <div class="photo cousin5">
            <img src="assets/images/cousin5.jpg" alt="Cousin 5">
        </div>

        <div class="photo cousin6">
            <img src="assets/images/cousin6.jpg" alt="Cousin 6">
        </div>

        <div class="photo cousin7">
            <img src="assets/images/cousin7.jpg" alt="Cousin 7">
        </div>


        <!-- QUOTE -->

        <div class="quote">

            <h1>Cousins</h1>

            <p>
                Connected by heart,<br>
                no distance and time<br>
                can break us apart.
            </p>

        </div>


    </main>


    <!-- MUSIC -->

    <audio
        id="background-music"
        loop
    >
        <source
            src="assets/music/background.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- MUSIC BUTTON -->

    <button
        id="music-button"
        aria-label="Play or Pause Music"
    >
        ▶
    </button>


    <script src="script.js"></script>

</body>

</html>
