<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05070a">
    <title>Tree Photo Collection | Cousins</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="scene" aria-labelledby="collection-title">
        <div class="scene-header"><span class="eyebrow">A living archive</span><span class="scene-counter">07 / 07 memories</span></div>
        <div class="tree-stage" aria-label="A glowing memory tree">
            <div class="ground-light" aria-hidden="true"></div>
            <svg class="tree" viewBox="0 0 1000 900" role="img" aria-labelledby="tree-title tree-description">
                <title id="tree-title">The memory tree</title>
                <desc id="tree-description">A warm golden tree grows from its roots into branches filled with leaves.</desc>
                <defs>
                    <linearGradient id="trunkShade" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8d5727"/><stop offset=".32" stop-color="#f3ce7a"/><stop offset=".58" stop-color="#fff2b7"/><stop offset="1" stop-color="#b67532"/></linearGradient>
                    <linearGradient id="leafGold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#d4933d"/><stop offset=".45" stop-color="#ffe6a0"/><stop offset="1" stop-color="#fffbe5"/></linearGradient>
                    <radialGradient id="halo"><stop stop-color="#f6c968" stop-opacity=".34"/><stop offset="1" stop-color="#f6c968" stop-opacity="0"/></radialGradient>
                    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <filter id="leafGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    <path id="leaf-shape" d="M0 0 C7 -9 18 -10 25 -3 C18 7 8 10 0 0Z"/>
                </defs>
                <ellipse class="tree-halo" cx="500" cy="385" rx="410" ry="370" fill="url(#halo)"/>
                <g class="growth roots"><path d="M500 792 C465 825 420 840 337 866 C402 856 456 858 485 829"/><path d="M500 792 C536 827 590 845 676 869 C610 854 555 856 520 827"/><path d="M482 814 C430 850 371 873 282 878"/><path d="M520 814 C575 848 642 871 746 878"/><path d="M462 830 C414 856 371 858 326 854"/><path d="M538 830 C588 855 636 858 692 851"/></g>
                <g class="growth trunk"><path class="trunk-main" d="M474 810 C480 752 457 710 481 648 C511 570 472 522 489 447 C502 386 527 326 497 239"/><path class="trunk-ridge" d="M506 810 C539 744 520 696 509 643 C494 569 526 521 511 449 C501 393 511 321 497 260"/><path class="trunk-ridge fine" d="M484 800 C512 734 500 684 490 637 C477 573 503 516 495 449"/></g>
                <g class="growth main-branches branch-sway"><path d="M488 651 C424 623 378 575 323 519 C268 463 206 433 126 369"/><path d="M510 651 C574 623 622 578 680 520 C739 468 805 430 876 361"/><path d="M494 508 C445 465 403 404 370 343 C338 286 288 232 216 169"/><path d="M505 509 C555 462 598 402 630 342 C666 277 713 225 785 165"/></g>
                <g class="growth secondary-branches branch-sway"><path d="M370 557 C321 527 274 482 235 430 C207 391 176 342 155 282"/><path d="M300 491 C246 480 197 454 151 415 C121 390 100 359 83 318"/><path d="M630 558 C678 526 719 480 757 423 C786 379 813 325 839 264"/><path d="M701 488 C755 471 807 443 850 405 C881 378 901 346 920 300"/><path d="M404 407 C360 373 321 330 302 278 C283 225 250 184 203 136"/><path d="M597 407 C641 370 679 327 705 275 C728 222 758 180 805 132"/></g>
                <g class="growth twigs branch-sway"><path d="M236 430 C192 425 153 399 120 362 M220 407 C187 373 170 329 170 281 M180 391 C139 370 107 339 84 302"/><path d="M756 424 C798 411 837 385 870 348 M782 399 C812 361 829 319 834 273 M823 386 C862 365 892 333 919 296"/><path d="M330 337 C288 311 250 276 225 237 M282 285 C247 248 224 207 207 165"/><path d="M670 332 C710 302 748 266 774 224 M721 281 C754 244 780 201 797 159"/><path d="M491 350 C462 301 449 247 454 192 C458 137 437 98 396 61 M510 350 C540 298 552 246 546 192 C541 137 563 96 604 61"/></g>
                <g id="leaves" class="leaves" aria-hidden="true"></g>
            </svg>
        </div>
        <section class="memory-copy" aria-label="Collection message"><span class="copy-rule"></span><p class="copy-kicker">A collection of little forever</p><h1 id="collection-title">Cousins</h1><p class="quote">Connected by heart,<br>no distance and time<br>can break us apart.</p></section>
        <section class="photos" aria-label="Cousin photographs">
            <figure class="photo photo-1"><img src="assets/images/cousin1.jpg" alt="Cousin memory one" loading="eager"></figure><figure class="photo photo-2"><img src="assets/images/cousin2.jpg" alt="Cousin memory two" loading="eager"></figure><figure class="photo photo-3"><img src="assets/images/cousin3.jpg" alt="Cousin memory three" loading="eager"></figure><figure class="photo photo-4"><img src="assets/images/cousin4.jpg" alt="Cousin memory four" loading="eager"></figure><figure class="photo photo-5"><img src="assets/images/cousin5.jpg" alt="Cousin memory five" loading="eager"></figure><figure class="photo photo-6"><img src="assets/images/cousin6.jpg" alt="Cousin memory six" loading="eager"></figure><figure class="photo photo-7"><img src="assets/images/cousin7.jpg" alt="Cousin memory seven" loading="eager"></figure>
        </section>
    </main>
    <button id="music-button" type="button" aria-label="Play background music" aria-pressed="false"><span class="music-icon" aria-hidden="true">▶</span><span class="music-label">Play music</span></button>
    <audio id="background-music" loop preload="metadata"><source src="assets/music/background.mp3" type="audio/mpeg"></audio>
    <script src="script.js"></script>
</body>
</html>
